<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logros</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:70px 18px 35px;background:linear-gradient(145deg,#fff2f6,#eee8fa);font-family:system-ui;color:#58434d}.back{position:fixed;top:14px;left:14px;text-decoration:none;color:#765865;background:#fff9;padding:9px 12px;border-radius:999px}main{width:min(94vw,720px);margin:auto}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.ach{padding:18px;border-radius:20px;background:#fff9}.locked{opacity:.45}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><a class="back" href="../../index.html">← Naye OS</a><main><h1>Logros 🏆</h1><p id="summary"></p><div id="grid" class="grid"></div></main><script>const defs=[['🚪','Primer inicio 2.1'],['📔','Primera página del diario'],['🎮','Naye Quest completado'],['🔎','¿Por qué estás tocando todo?'],['🧭','Exploradora']];let s=JSON.parse(localStorage.getItem('nayeOSState')||'{"xp":0,"visited":[],"achievements":[],"questWins":0}');if(s.visited.length>=8&&!s.achievements.includes('Exploradora')){s.achievements.push('Exploradora');s.xp+=30;localStorage.setItem('nayeOSState',JSON.stringify(s))}summary.textContent=s.achievements.length+' logros · '+s.xp+' XP';defs.forEach(x=>{let ok=s.achievements.includes(x[1]),d=document.createElement('div');d.className='ach '+(ok?'':'locked');d.innerHTML='<h2>'+(ok?x[0]:'🔒')+'</h2><h3>'+x[1]+'</h3>';grid.appendChild(d)})</script></body></html>
