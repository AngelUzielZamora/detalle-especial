<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cápsula</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:70px 18px 35px;background:linear-gradient(145deg,#fff2f6,#eee8fa);font-family:system-ui;color:#58434d}.back{position:fixed;top:14px;left:14px;text-decoration:none;color:#765865;background:#fff9;padding:9px 12px;border-radius:999px;z-index:10}main{width:min(94vw,720px);margin:auto}.cap{background:#fff9;border-radius:20px;padding:18px;margin:12px 0}.cap button{border:0;border-radius:999px;background:#c99a65;color:white;padding:9px 14px;font-weight:800}
</style></head><body><a class="back" href="../../index.html">← Naye OS</a><main><h1>Cápsula del tiempo ⏳</h1><div id="cards"></div></main><script src="../../js/state.js"></script><script>const data=[['Abrir cuando quieras',null,'No hacía falta esperar ninguna fecha: me gusta hacerte estos detallitos. ♡'],['Abrir el 21 de agosto de 2026','2026-08-21','Espero que este plan nos deje un recuerdo muy bonito.'],['Abrir el 31 de diciembre de 2026','2026-12-31','Gracias por formar parte de varias de las cosas que más disfruté este año.']];data.forEach(x=>{let ok=!x[1]||new Date()>=new Date(x[1]);let d=document.createElement('div');d.className='cap';d.innerHTML='<h3>'+(ok?'🔓 ':'🔒 ')+x[0]+'</h3><button '+(ok?'':'disabled')+'>'+(ok?'Abrir':'Bloqueado')+'</button>';d.querySelector('button').onclick=()=>alert(x[2]);cards.appendChild(d)});</script></body></html>
