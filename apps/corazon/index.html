<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>El primero · Naye OS</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:radial-gradient(circle at center,#2d1423,#100810 70%);display:grid;place-items:center;font-family:system-ui;color:white}.back{position:fixed;left:15px;top:15px;color:#fff;text-decoration:none;background:#ffffff18;padding:9px 12px;border-radius:999px;z-index:20}.wrap{text-align:center;width:min(94vw,650px)}h1{font-weight:750;margin-bottom:8px}.sub{color:#e8b8cf;margin-top:0}.canvas{position:relative;width:min(88vw,500px);height:410px;margin:auto}.pixel{position:absolute;width:10px;height:10px;border-radius:50%;background:#ff5f91;box-shadow:0 0 14px #ff5f91;opacity:0;transform:scale(.3);transition:opacity .5s,transform .5s}.show{opacity:1;transform:scale(1)}button{border:0;border-radius:999px;padding:12px 20px;background:#ee5e8d;color:white;font-weight:800;cursor:pointer;box-shadow:0 10px 30px #ee5e8d44}.message{opacity:0;transition:1s;margin-top:10px;color:#ffd8e6}.message.showmsg{opacity:1}@media(max-width:500px){.canvas{height:350px}.pixel{width:8px;height:8px}}</style></head><body>
<a class="back" href="../../index.html">← Naye OS</a><main class="wrap"><h1>El primero ❤️</h1><p class="sub">Una reconstrucción del detallito con el que empezó todo.</p><div class="canvas" id="canvas"></div><button id="draw">Haz clic aquí</button><p class="message" id="msg">Para Naye, porque hasta unas cuantas líneas de código pueden decir “pensé en ti”. ♡</p></main>
<script>
const c=document.getElementById('canvas');const pts=[];for(let t=0;t<Math.PI*2;t+=0.055){let x=16*Math.pow(Math.sin(t),3);let y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);pts.push([x,y])}
pts.forEach((p,i)=>{const s=document.createElement('span');s.className='pixel';s.style.left=(50+p[0]*2.15)+'%';s.style.top=(48-p[1]*2.15)+'%';c.appendChild(s)});
draw.onclick=()=>{document.querySelectorAll('.pixel').forEach((e,i)=>setTimeout(()=>e.classList.add('show'),i*7));setTimeout(()=>msg.classList.add('showmsg'),pts.length*7+300)};
</script></body></html>
