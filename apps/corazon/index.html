<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>El primero</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:radial-gradient(circle at center,#301321,#10080f 72%);display:grid;place-items:center;font-family:system-ui;color:white;padding:65px 12px 20px}.back{position:fixed;left:14px;top:14px;color:#fff;text-decoration:none;background:#ffffff18;padding:9px 12px;border-radius:999px;z-index:20}main{text-align:center;width:min(95vw,650px)}h1{margin-bottom:4px}p{color:#eebbd0}.canvas{position:relative;width:min(92vw,500px);height:390px;margin:auto}.dot{position:absolute;width:9px;height:9px;border-radius:50%;background:#ff5f91;box-shadow:0 0 14px #ff5f91;opacity:0;transform:scale(.1);transition:.4s}.dot.show{opacity:1;transform:scale(1)}button{border:0;border-radius:999px;padding:12px 20px;background:#ee5e8d;color:#fff;font-weight:850;cursor:pointer}#msg{opacity:0;transition:1s;color:#ffd9e7}#msg.show{opacity:1}
</style></head><body><a class="back" href="../../index.html">← Naye OS</a><main><h1>El primero ❤️</h1><p>Una reconstrucción del detallito con el que empezó esto.</p><div class="canvas" id="c"></div><button id="go">Dibujar corazón</button><p id="msg">Para Naye. Porque aparentemente mi lenguaje del amor también incluye JavaScript. ♡</p></main><script>
const pts=[];for(let t=0;t<Math.PI*2;t+=.05){let x=16*Math.sin(t)**3,y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);pts.push([x,y])}
pts.forEach(p=>{let d=document.createElement('span');d.className='dot';d.style.left=(50+p[0]*2.05)+'%';d.style.top=(48-p[1]*2.05)+'%';c.appendChild(d)});go.onclick=()=>{document.querySelectorAll('.dot').forEach((d,i)=>setTimeout(()=>d.classList.add('show'),i*6));setTimeout(()=>msg.classList.add('show'),pts.length*6+250)}
</script></body></html>
