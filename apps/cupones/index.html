<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cupones</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:70px 18px 35px;background:linear-gradient(145deg,#fff2f6,#eee8fa);font-family:system-ui;color:#58434d}.back{position:fixed;top:14px;left:14px;text-decoration:none;color:#765865;background:#fff9;padding:9px 12px;border-radius:999px;z-index:10}main{width:min(94vw,720px);margin:auto}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.coupon{padding:20px;border-radius:20px;background:#fff9;border:2px dashed #e0ae89;text-align:center}.used{opacity:.5}.coupon button{border:0;border-radius:999px;padding:9px 14px;background:#e69a73;color:#fff;font-weight:800}@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style></head><body><a class="back" href="../../index.html">← Naye OS</a><main><h1>Cupones N + A 🎟️</h1><section id="grid" class="grid"></section></main><script src="../../js/state.js"></script><script>const c=[['🤗','Un abrazo'],['🍰','Un postre'],['🍜','Tú eliges dónde comemos'],['🎬','Plan a tu elección'],['🚗','Una vuelta sin rumbo'],['🎁','Plan sorpresa']];let u=JSON.parse(localStorage.getItem('nayeCoupons')||'[]');c.forEach((x,i)=>{let d=document.createElement('div');d.className='coupon '+(u.includes(i)?'used':'');d.innerHTML='<h2>'+x[0]+'</h2><h3>'+x[1]+'</h3><button '+(u.includes(i)?'disabled':'')+'>'+(u.includes(i)?'Canjeado':'Canjear')+'</button>';d.querySelector('button').onclick=()=>{if(confirm('¿Canjear este cupón?')){u.push(i);localStorage.setItem('nayeCoupons',JSON.stringify(u));NayeOS.awardXP(15,'Primer cupón');location.reload()}};grid.appendChild(d)});</script></body></html>
