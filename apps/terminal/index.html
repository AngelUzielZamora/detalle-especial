<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Terminal</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:70px 18px 35px;background:linear-gradient(145deg,#fff2f6,#eee8fa);font-family:system-ui;color:#58434d}.back{position:fixed;top:14px;left:14px;text-decoration:none;color:#765865;background:#fff9;padding:9px 12px;border-radius:999px}main{width:min(94vw,720px);margin:auto}.term{min-height:360px;background:#07110b;color:#c8f2da;border-radius:14px;padding:16px;font-family:Consolas}.row{display:flex;gap:8px;background:#07110b;color:#7cdaa8;padding:12px;border-radius:10px;margin-top:8px}.row input{flex:1;border:0;background:transparent;color:white;font:inherit;outline:none}</style></head><body><a class="back" href="../../index.html">← Naye OS</a><main><h1>Terminal de Ángel 💻</h1><div class="term" id="screen"><p>Escribe <b>help</b> para empezar.</p></div><div class="row"><span>naye@os:~$</span><input id="cmd"></div></main><script>const r={help:'Comandos: help, status, angel, naye, hug, future, love, date, secret',status:'Sistema estable. Ángel: ligeramente distraído.',angel:'Desarrollador principal. Bug conocido: piensa demasiado en Naye.',naye:'Usuaria administradora. Permisos: todos.',hug:'Solicitud de abrazo registrada 🤗',future:'Todavía faltan muchos planes por hacer.',love:'♡♡♡',date:'Sugerencia: comida rica + plática + cero prisas.',secret:'Pista: toca cinco veces la N en el inicio.'};cmd.onkeydown=e=>{if(e.key==='Enter'){let v=cmd.value.trim().toLowerCase();screen.innerHTML+='<p><b>$ '+v+'</b><br>'+(r[v]||'Comando no reconocido.')+'</p>';cmd.value=''}}</script></body></html>
