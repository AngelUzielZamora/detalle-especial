<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Misiones</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:70px 18px 35px;background:linear-gradient(145deg,#fff2f6,#eee8fa);font-family:system-ui;color:#58434d}.back{position:fixed;top:14px;left:14px;text-decoration:none;color:#765865;background:#fff9;padding:9px 12px;border-radius:999px;z-index:10}main{width:min(94vw,720px);margin:auto}.mission{padding:16px;border-radius:18px;background:#fff9;margin:10px 0;display:flex;justify-content:space-between;gap:12px}.done{opacity:.65}.reward{margin-top:18px;padding:16px;border-radius:18px;background:#fff2c9;font-weight:700}
</style></head><body><a class="back" href="../../index.html">← Naye OS</a><main><h1>Misiones de hoy 🎯</h1><p>Se reinician cada día.</p><section id="list"></section><div class="reward" id="reward"></div></main><script src="../../js/state.js"></script><script>const s=NayeOS.ensure(),day=NayeOS.todayKey(),d=s.daily[day]||{};const defs=[['Abrir 3 apps','apps',3],['Escribir en el diario','diary',1],['Consultar el oráculo','oracle',1],['Jugar Naye Quest','quest',1]];let done=0;defs.forEach(x=>{let ok=(d[x[1]]||0)>=x[2];if(ok)done++;let a=document.createElement('div');a.className='mission '+(ok?'done':'');a.innerHTML='<div><b>'+x[0]+'</b><small> '+Math.min(d[x[1]]||0,x[2])+'/'+x[2]+'</small></div><span>'+(ok?'✅':'⬜')+'</span>';list.appendChild(a)});let claimed=localStorage.getItem('nayeMissionReward_'+day)==='1';if(done===4&&!claimed){reward.innerHTML='🎁 ¡Completaste todo! <button id="claim">Cobrar 50 XP + 5 monedas</button>';claim.onclick=()=>{let s=NayeOS.ensure();s.xp+=50;s.coins+=5;NayeOS.save(s);localStorage.setItem('nayeMissionReward_'+day,'1');location.reload()}}else reward.textContent=claimed?'Premio diario cobrado ♡':done+'/4 misiones completadas';</script></body></html>
