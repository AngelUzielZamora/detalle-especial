<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diario</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:70px 18px 35px;background:linear-gradient(145deg,#fff2f6,#eee8fa);font-family:system-ui;color:#58434d}.back{position:fixed;top:14px;left:14px;text-decoration:none;color:#765865;background:#fff9;padding:9px 12px;border-radius:999px}main{width:min(94vw,720px);margin:auto}.composer,.entry{background:#fff9;border-radius:20px;padding:16px;margin:12px 0}.composer textarea{width:100%;min-height:130px;border:0;border-radius:14px;padding:12px;font:inherit}.composer button{margin-top:10px;border:0;border-radius:999px;background:#d78ba6;color:white;padding:10px 16px;font-weight:800}.entry p{font-family:Georgia,serif;line-height:1.6}.entry small{color:#947a86}</style></head><body><a class="back" href="../../index.html">← Naye OS</a><main><h1>Diario de Naye 📔</h1><p>Lo que escribas aquí se queda solamente en este navegador.</p><section class="composer"><textarea id="text" placeholder="¿Qué estás pensando hoy?"></textarea><button id="save">Guardar pensamiento</button></section><section id="entries"></section></main><script>function get(){return JSON.parse(localStorage.getItem('nayeDiary')||'[]')}function put(v){localStorage.setItem('nayeDiary',JSON.stringify(v))}function render(){let e=get();entries.innerHTML='';e.forEach(x=>{let a=document.createElement('article');a.className='entry';a.innerHTML='<p>'+x.text.replace(/</g,'&lt;')+'</p><small>'+x.date+'</small>';entries.appendChild(a)})}save.onclick=()=>{let v=text.value.trim();if(!v)return;let e=get();e.unshift({text:v,date:new Date().toLocaleString('es-MX')});put(e);let s=JSON.parse(localStorage.getItem('nayeOSState')||'{"xp":0,"visited":[],"achievements":[],"questWins":0}');if(!s.achievements.includes('Primera página del diario')){s.achievements.push('Primera página del diario');s.xp+=20;localStorage.setItem('nayeOSState',JSON.stringify(s))}text.value='';render();alert('Pensamiento guardado ♡')};render();</script></body></html>
