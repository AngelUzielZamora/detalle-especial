<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tienda</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:70px 18px 35px;background:linear-gradient(145deg,#fff2f6,#eee8fa);font-family:system-ui;color:#58434d}.back{position:fixed;top:14px;left:14px;text-decoration:none;color:#765865;background:#fff9;padding:9px 12px;border-radius:999px;z-index:10}main{width:min(94vw,720px);margin:auto}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.item{padding:18px;border-radius:18px;background:#fff9;text-align:center}.item button{border:0;border-radius:999px;padding:9px 14px;background:#ad88d8;color:white;font-weight:800}.owned{opacity:.7}@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style></head><body><a class="back" href="../../index.html">← Naye OS</a><main><h1>Tienda de Naye OS 🏪</h1><p>Tus monedas: <b id="coins"></b> 🪙</p><section id="items" class="grid"></section></main><script src="../../js/state.js"></script><script>let s=NayeOS.ensure();coins.textContent=s.coins;const items=[['🌙','Tema Noche','noche',5],['💜','Tema Lavanda','lavanda',5],['🎮','Tema Pixel','pixel',7],['🌸','Tema Rosa','rosa',0]];let owned=JSON.parse(localStorage.getItem('nayeOwnedThemes')||'["rosa"]');items.forEach(x=>{let has=owned.includes(x[2]),d=document.createElement('div');d.className='item '+(has?'owned':'');d.innerHTML='<h2>'+x[0]+'</h2><h3>'+x[1]+'</h3><p>'+x[3]+' 🪙</p><button>'+(has?'Usar':'Comprar')+'</button>';d.querySelector('button').onclick=()=>{s=NayeOS.ensure();if(!has){if(s.coins<x[3])return alert('No hay suficientes monedas 👀');s.coins-=x[3];NayeOS.save(s);owned.push(x[2]);localStorage.setItem('nayeOwnedThemes',JSON.stringify(owned));}s=NayeOS.ensure();s.theme=x[2];NayeOS.save(s);alert('Tema aplicado ♡');location.reload()};items.appendChild(d)});</script></body></html>
