<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Naye Quest</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:70px 18px 35px;background:linear-gradient(145deg,#fff2f6,#eee8fa);font-family:system-ui;color:#58434d}.back{position:fixed;top:14px;left:14px;text-decoration:none;color:#765865;background:#fff9;padding:9px 12px;border-radius:999px;z-index:10}main{width:min(94vw,720px);margin:auto}.game{position:relative;height:420px;border-radius:22px;background:linear-gradient(#c9e7ff 0 70%,#b6df9c 70%);overflow:hidden}.player{position:absolute;left:20px;bottom:15px;font-size:2rem}.heart{position:absolute;font-size:1.5rem}.controls{display:flex;justify-content:center;gap:10px;margin-top:12px}.controls button{border:0;border-radius:12px;background:#8d79c7;color:#fff;padding:10px 15px;font-size:1.2rem}
</style></head><body><a class="back" href="../../index.html">← Naye OS</a><main><h1>Naye Quest 🎮</h1><p>Recoge los 5 corazones.</p><div>Corazones: <b id="score">0</b>/5</div><div id="game" class="game"><div id="player" class="player">🧍‍♀️</div></div><div class="controls"><button id="left">←</button><button id="up">↑</button><button id="right">→</button><button id="down">↓</button></div><p id="msg"></p></main><script src="../../js/state.js"></script><script>NayeOS.touchDaily('quest');let x=20,y=15,n=0;[[18,20],[72,22],[48,52],[23,75],[78,72]].forEach(p=>{let h=document.createElement('span');h.className='heart';h.textContent='💗';h.style.left=p[0]+'%';h.style.top=p[1]+'%';game.appendChild(h)});function move(dx,dy){x=Math.max(0,Math.min(game.clientWidth-42,x+dx));y=Math.max(0,Math.min(game.clientHeight-42,y+dy));player.style.left=x+'px';player.style.bottom=y+'px';let pr=player.getBoundingClientRect();document.querySelectorAll('.heart').forEach(h=>{let r=h.getBoundingClientRect();if(!(pr.right<r.left||pr.left>r.right||pr.bottom<r.top||pr.top>r.bottom)){h.remove();score.textContent=++n;if(n===5){msg.textContent='¡Completado! Ángel te debe un abrazo 💗';let s=NayeOS.ensure();s.questWins=(s.questWins||0)+1;NayeOS.save(s);NayeOS.awardXP(40,'Naye Quest completado')}}})}left.onclick=()=>move(-28,0);right.onclick=()=>move(28,0);up.onclick=()=>move(0,28);down.onclick=()=>move(0,-28);</script></body></html>
