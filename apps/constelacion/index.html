<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Constelación</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:70px 18px 35px;background:linear-gradient(145deg,#fff2f6,#eee8fa);font-family:system-ui;color:#58434d}.back{position:fixed;top:14px;left:14px;text-decoration:none;color:#765865;background:#fff9;padding:9px 12px;border-radius:999px}main{width:min(94vw,720px);margin:auto}.sky{position:relative;height:430px;border-radius:24px;background:radial-gradient(circle at top,#1c2c5d,#070b18 70%);overflow:hidden}.star{position:absolute;border:0;background:transparent;font-size:1.7rem;color:white}.info{margin-top:12px;padding:16px;border-radius:18px;background:#fff9;text-align:center}</style></head><body><a class="back" href="../../index.html">← Naye OS</a><main><h1>Nuestra constelación 🌌</h1><p>Toca una estrella.</p><div id="sky" class="sky"></div><div class="info"><h2 id="title">✨</h2><p id="desc">Elige una.</p></div></main><script>const s=[[18,25,'El primer detalle','Un corazón hecho con código.'],[40,55,'Una cartita','Otro pequeño “pensé en ti”.'],[63,27,'Archivo confidencial','La investigación confirmó niveles críticos de ternura.'],[78,65,'Naye OS','La idea se salió un poquito de control.'],[26,78,'Próximo recuerdo','Todavía no ha pasado.']];s.forEach(x=>{let b=document.createElement('button');b.className='star';b.textContent='✦';b.style.left=x[0]+'%';b.style.top=x[1]+'%';b.onclick=()=>{title.textContent=x[2];desc.textContent=x[3]};sky.appendChild(b)})</script></body></html>
