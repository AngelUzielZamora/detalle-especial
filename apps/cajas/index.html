<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cajas secretas</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:70px 18px 35px;background:linear-gradient(145deg,#fff2f6,#eee8fa);font-family:system-ui;color:#58434d}.back{position:fixed;top:14px;left:14px;text-decoration:none;color:#765865;background:#fff9;padding:9px 12px;border-radius:999px;z-index:10}main{width:min(94vw,720px);margin:auto}.box{padding:18px;border-radius:20px;background:#fff9;margin:12px 0}.box button{border:0;border-radius:999px;padding:9px 14px;background:#d58cab;color:white;font-weight:800}
</style></head><body><a class="back" href="../../index.html">← Naye OS</a><main><h1>Cajas secretas 🎁</h1><p>Algunas se abren con XP.</p><section id="boxes"></section></main><script src="../../js/state.js"></script><script>const defs=[[0,'Caja 1','Mensaje: gracias por seguir picándole a todo ♡'],[100,'Caja 2','Premio: un cupón moralmente vinculante por un abrazo.'],[250,'Caja 3','Secreto: Naye OS tiene muchas más ideas guardadas para después.'],[500,'Caja final','Título desbloqueado: USUARIA DEFINITIVA 🏆']];const s=NayeOS.ensure();defs.forEach(x=>{let ok=s.xp>=x[0],d=document.createElement('div');d.className='box';d.innerHTML='<h3>'+(ok?'🔓':'🔒')+' '+x[1]+'</h3><p>Requiere '+x[0]+' XP</p><button '+(ok?'':'disabled')+'>'+(ok?'Abrir':'Bloqueada')+'</button>';d.querySelector('button').onclick=()=>alert(x[2]);boxes.appendChild(d)});</script></body></html>
