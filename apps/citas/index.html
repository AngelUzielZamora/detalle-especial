<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Citas</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:70px 18px 30px;background:linear-gradient(145deg,#fff3dd,#ffe4ed);font-family:system-ui;color:#5c443e}.back{position:fixed;left:14px;top:14px;color:#74564e;text-decoration:none;background:#ffffffaa;padding:9px 12px;border-radius:999px}main{width:min(94vw,560px);text-align:center}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.slot{padding:20px 10px;border-radius:22px;background:#fff9;box-shadow:0 12px 35px #8d61521d}.emoji{font-size:2.2rem;display:block}.label{font-size:.7rem;color:#a78172}.value{font-weight:800;margin-top:7px;min-height:42px;display:grid;place-items:center}.res{padding:16px;border-radius:18px;background:#fff7;border:1px solid #fff;line-height:1.55}button{border:0;border-radius:999px;padding:13px 22px;background:#e89570;color:white;font-weight:850;cursor:pointer;margin-top:18px}@media(max-width:450px){.slots{grid-template-columns:1fr}}
</style></head><body><a class="back" href="../../index.html">← Naye OS</a><main><h1>Generador de citas 🎰</h1><p>Deja que Naye OS arme el plan.</p><div class="slots"><div class="slot"><span class="emoji">🍜</span><span class="label">COMIDA</span><div class="value" id="food">???</div></div><div class="slot"><span class="emoji">📍</span><span class="label">LUGAR</span><div class="value" id="place">???</div></div><div class="slot"><span class="emoji">✨</span><span class="label">PLAN</span><div class="value" id="plan">???</div></div></div><div class="res" id="res">Cita pendiente de desbloquear 💗</div><button id="spin">Generar cita</button></main><script>
const f=['Tacos','Ramen','Pizza','Cafecito y postre','Sushi','Cena bonita','Desayuno juntos'],l=['Un mirador','Un lugar nuevo','Nuestro lugar favorito','Una terraza','Donde Naye elija','Una escapada improvisada'],p=['Platicar sin ver la hora','Caminar y escuchar música','Tomarnos fotos','Ver el atardecer','Probar algo nuevo','Solo estar juntos','Plan sorpresa de Ángel'];spin.onclick=()=>{let n=0;let iv=setInterval(()=>{food.textContent=f[Math.floor(Math.random()*f.length)];place.textContent=l[Math.floor(Math.random()*l.length)];plan.textContent=p[Math.floor(Math.random()*p.length)];if(++n>12){clearInterval(iv);res.innerHTML='<b>Cita desbloqueada 💗</b><br>La usuaria autorizada conserva derecho de veto.'}},80)}
</script></body></html>
