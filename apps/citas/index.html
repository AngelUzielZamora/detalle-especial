<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Citas · Naye OS</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:70px 18px 30px;background:linear-gradient(145deg,#fff3dd,#ffe4ed);font-family:system-ui;color:#5c443e}.back{position:fixed;left:14px;top:14px;color:#74564e;text-decoration:none;background:#ffffffaa;padding:9px 12px;border-radius:999px}.card{width:min(94vw,560px);text-align:center}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.slot{padding:20px 10px;border-radius:22px;background:#fff9;box-shadow:0 12px 35px #8d61521d}.emoji{font-size:2.2rem;display:block}.label{font-size:.7rem;color:#a78172;text-transform:uppercase;letter-spacing:.08em}.value{font-weight:800;margin-top:7px;min-height:42px;display:grid;place-items:center}.result{padding:16px;border-radius:18px;background:#fff7;border:1px solid #fff;line-height:1.55}.spin{border:0;border-radius:999px;padding:13px 22px;background:#e89570;color:white;font-weight:850;cursor:pointer;margin-top:18px}@media(max-width:450px){.slots{grid-template-columns:1fr}.slot{padding:13px}}</style></head><body>
<a class="back" href="../../index.html">← Naye OS</a><main class="card"><h1>Generador de citas 🎰</h1><p>Presiona el botón y deja que Naye OS arme el plan.</p><div class="slots"><div class="slot"><span class="emoji">🍜</span><span class="label">Comida</span><div class="value" id="food">???</div></div><div class="slot"><span class="emoji">📍</span><span class="label">Lugar</span><div class="value" id="place">???</div></div><div class="slot"><span class="emoji">✨</span><span class="label">Plan</span><div class="value" id="plan">???</div></div></div><div class="result" id="result">Cita pendiente de desbloquear 💗</div><button class="spin" id="spin">Generar cita</button></main>
<script>
const foods=['Tacos','Ramen','Pizza','Cafecito y postre','Sushi','Algo que se nos antoje ese día','Cena bonita','Desayuno juntos'];
const places=['Un mirador','Un lugar nuevo','Nuestro lugar favorito','El centro','Un parque','Una terraza','Donde Naye elija','Una escapada improvisada'];
const plans=['Platicar sin ver la hora','Caminar y escuchar música','Tomarnos fotos','Ver el atardecer','Probar algo nuevo','Jugar algo juntos','Solo estar juntos','Plan sorpresa de Ángel'];
spin.onclick=()=>{let n=0;const iv=setInterval(()=>{food.textContent=foods[Math.floor(Math.random()*foods.length)];place.textContent=places[Math.floor(Math.random()*places.length)];plan.textContent=plans[Math.floor(Math.random()*plans.length)];if(++n>12){clearInterval(iv);result.innerHTML='Resultado: <strong>cita desbloqueada 💗</strong><br>La combinación puede negociarse con la usuaria autorizada.'}},75)}
</script></body></html>
