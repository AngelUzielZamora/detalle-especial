<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notas</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:70px 18px 35px;background:linear-gradient(145deg,#fff4ec,#fff0f5);font-family:system-ui;color:#59443f}.back{position:fixed;left:14px;top:14px;color:#6f564f;text-decoration:none;background:#fff9;padding:9px 12px;border-radius:999px}main{width:min(94vw,680px);margin:auto}h1{text-align:center}.notes{display:grid;gap:13px;margin-top:22px}button{text-align:left;border:0;border-radius:20px;padding:18px;background:#fff9;box-shadow:0 10px 28px #87605016;font:inherit;color:#5c4741;cursor:pointer}button b{display:block}button small{display:block;color:#9c7d73;margin-top:4px}.msg{display:none;margin-top:14px;padding:20px;border-radius:20px;background:#fffdf8;line-height:1.65;box-shadow:0 15px 35px #815b4c12}
</style></head><body><a class="back" href="../../index.html">← Naye OS</a><main><h1>Ábreme cuando… 📝</h1><div class="notes"><button data-msg="Si hoy estuvo pesado, no tienes que resolver todo ahorita. Come algo rico, descansa tantito y recuerda que alguien por aquí quiere que estés bien. ♡"><b>…hayas tenido un día pesado</b><small>Para bajar un poquito el ruido.</small></button><button data-msg="Entonces funcionó exactamente como estaba planeado 😌. Ven a cualquiera de las otras apps y sigue picándole a cosas."><b>…necesites una sonrisa</b><small>Uso recomendado sin moderación.</small></button><button data-msg="Yo también. Y queda registrado oficialmente en Naye OS. 💗"><b>…me extrañes</b><small>Mensaje corto pero importante.</small></button><button data-msg="No necesitas una razón especial para abrir esto: me gusta compartir contigo, y ya."><b>…solo quieras abrir una</b><small>La opción sin pretexto.</small></button></div><div id="msg" class="msg"></div></main><script>
document.querySelectorAll('button[data-msg]').forEach(b=>b.onclick=()=>{msg.textContent=b.dataset.msg;msg.style.display='block';msg.scrollIntoView({behavior:'smooth'})})
</script></body></html>
