<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Nayeli ❤️</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;color:#fff;background:radial-gradient(circle at 50% 20%,#4a102c 0%,#210914 45%,#080207 100%)}
.card{width:min(92vw,620px);min-height:520px;padding:34px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1px solid rgba(255,255,255,.12);border-radius:28px;background:rgba(255,255,255,.06);box-shadow:0 24px 80px rgba(0,0,0,.45);backdrop-filter:blur(10px)}
h1{margin:0 0 12px;font-size:clamp(2rem,8vw,3.8rem)}
.intro{margin:0 0 28px;color:#ffd8e5;font-size:1.08rem}
button{padding:15px 28px;border:0;border-radius:999px;font-size:1rem;font-weight:700;cursor:pointer;color:#65102f;background:linear-gradient(135deg,#fff2f7,#ffb8cf);box-shadow:0 10px 30px rgba(255,70,130,.28);transition:.2s}
button:hover{transform:translateY(-2px) scale(1.02)}
button:active{transform:scale(.97)}
.surprise{display:none;flex-direction:column;align-items:center;animation:appear .8s ease forwards}
.heart{position:relative;width:150px;height:135px;margin:52px 0 34px;transform:rotate(-45deg);background:#ff2f6d;filter:drop-shadow(0 0 24px rgba(255,47,109,.75));animation:beat 1s ease-in-out infinite}
.heart:before,.heart:after{content:"";position:absolute;width:150px;height:135px;border-radius:50%;background:#ff2f6d}
.heart:before{top:-75px;left:0}.heart:after{top:0;left:75px}
.message{margin-top:12px;font-size:clamp(1.6rem,6vw,2.5rem);font-weight:800}
.submessage{max-width:460px;margin:10px auto 0;color:#ffd3e1;font-size:1.06rem;line-height:1.55}
.signature{margin-top:18px;color:#ff94b7;font-weight:700}
.spark{position:fixed;pointer-events:none;font-size:22px;animation:float 2.8s ease-out forwards}
@keyframes beat{0%,100%{transform:rotate(-45deg) scale(1)}25%{transform:rotate(-45deg) scale(1.08)}45%{transform:rotate(-45deg) scale(.98)}65%{transform:rotate(-45deg) scale(1.12)}}
@keyframes appear{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%{opacity:0;transform:translateY(0) scale(.5)}15%{opacity:1}100%{opacity:0;transform:translateY(-180px) scale(1.3) rotate(25deg)}}
@media(max-width:520px){.card{min-height:88vh}}
</style>
</head>
<body>
<main class="card">
<section id="start">
<h1>Hola, Nayeli ✨</h1>
<p class="intro">Ángel preparó algo pequeño especialmente para ti.</p>
<button id="openButton">Presiona aquí ❤️</button>
</section>
<section id="surprise" class="surprise">
<div class="heart"></div>
<div class="message">Para ti, Nayeli ❤️</div>
<p class="submessage">Gracias por llegar a mi vida y hacerla más bonita. Quería regalarte un detalle hecho por mí, porque tú también eres alguien muy especial para mí.</p>
<div class="signature">Con cariño, Ángel</div>
</section>
</main>
<script>
const button=document.getElementById("openButton");
const start=document.getElementById("start");
const surprise=document.getElementById("surprise");
button.addEventListener("click",()=>{
 start.style.display="none";
 surprise.style.display="flex";
 for(let i=0;i<32;i++)setTimeout(createSpark,i*90);
});
function createSpark(){
 const spark=document.createElement("span");
 spark.className="spark";
 spark.textContent=Math.random()>.35?"❤️":"✨";
 spark.style.left=Math.random()*100+"vw";
 spark.style.top=(65+Math.random()*25)+"vh";
 spark.style.fontSize=(14+Math.random()*22)+"px";
 document.body.appendChild(spark);
 setTimeout(()=>spark.remove(),2900);
}
</script>
</body>
</html>
